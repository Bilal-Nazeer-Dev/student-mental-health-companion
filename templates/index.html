<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feelora — AI Student Mental Health Companion</title>
  <meta name="description" content="Feelora is your AI-powered mental health companion. Get instant emotional support, track your mood, and build healthy study habits." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); overflow: hidden; }

    .auth-bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,58,237,0.25) 0%, transparent 70%),
                  radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6,182,212,0.15) 0%, transparent 60%),
                  var(--bg);
    }
    .auth-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: floatOrb 8s ease-in-out infinite;
    }
    .auth-orb-1 { width: 400px; height: 400px; top: -100px; left: -100px; background: var(--primary); animation-delay: 0s; }
    .auth-orb-2 { width: 300px; height: 300px; bottom: -80px; right: -80px; background: var(--secondary); animation-delay: -4s; }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .auth-card {
      position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 48px 40px;
      background: rgba(26, 26, 46, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,58,237,0.1);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
    }
    .logo-text { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #fff 30%, var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-top: -4px; }

    .tab-row { display: flex; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 4px; margin-bottom: 28px; }
    .tab-btn {
      flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted);
      font-family: inherit; font-size: 14px; font-weight: 500; border-radius: 9px; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(124,58,237,0.4); }

    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 13px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; color: var(--text); font-family: inherit; font-size: 15px;
      transition: all 0.2s; box-sizing: border-box; outline: none;
    }
    .form-input:focus { border-color: var(--primary); background: rgba(124,58,237,0.08); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    .form-input::placeholder { color: rgba(148,163,184,0.5); }

    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--primary), #9F67FF);
      color: #fff; font-family: inherit; font-size: 15px; font-weight: 600;
      transition: all 0.2s; letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(124,58,237,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(124,58,237,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg { display: none; padding: 12px 16px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: #FCA5A5; font-size: 13px; margin-bottom: 16px; }
    .error-msg.show { display: block; animation: fadeIn 0.2s ease; }

    .divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: rgba(255,255,255,0.07); }
    .divider::before { left: 0; } .divider::after { right: 0; }

    .features-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }
    .feature-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .feature-item span:first-child { font-size: 16px; }
  </style>
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <div>
        <div class="logo-text">Feelora</div>
        <div class="logo-sub">AI Mental Health Companion</div>
      </div>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
    </div>

    <div id="error-box" class="error-msg"></div>

    <!-- Login Form -->
    <div id="panel-login" class="form-panel active">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input id="login-username" class="form-input" type="text" placeholder="Enter your username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="login-password" class="form-input" type="password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="panel-register" class="form-panel">
      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input id="reg-username" class="form-input" type="text" placeholder="Choose a username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="reg-email" class="form-input" type="email" placeholder="your@email.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="reg-password" class="form-input" type="password" placeholder="At least 6 characters" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
      </form>
    </div>

    <div class="divider">Everything you share stays private</div>
    <div class="features-list">
      <div class="feature-item"><span>🤖</span><span>AI Powered Chat</span></div>
      <div class="feature-item"><span>😊</span><span>Mood Tracking</span></div>
      <div class="feature-item"><span>📅</span><span>Study Planner</span></div>
      <div class="feature-item"><span>🧘</span><span>Relaxation Guide</span></div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-register').classList.toggle('active', tab === 'register');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideError();
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.classList.add('show');
    }

    function hideError() {
      document.getElementById('error-box').classList.remove('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-username').value,
            password: document.getElementById('login-password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('feelora_user', JSON.stringify(data.user));
          window.location.href = '/app';
        } else {
          showError(data.error || 'Login failed. Please try again.');
        }
      } catch {
        showError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('reg-username').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('feelora_user', JSON.stringify(data.user));
          window.location.href = '/app';
        } else {
          showError(data.error || 'Registration failed. Please try again.');
        }
      } catch {
        showError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
